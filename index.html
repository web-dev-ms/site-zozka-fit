<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZOZKA FIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
  /* ============ ألوان اللوجو (أحمر + أسود فحمي + فضي معدني) ============ */
  :root{
    --red:#b5121b;
    --red-dark:#7d0c12;
    --red-glow:rgba(181,18,27,.35);
    --black:#1a1a1c;
    --text:#1a1a1c;
    --muted:#6b6d72;
    --silver:#e9e9eb;
    --silver-2:#d3d4d7;
    --line:#c3c4c8;
    --panel:#f6f6f7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Cairo',sans-serif;
    color:var(--text);
    min-height:100vh;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.35) 0 2px, rgba(0,0,0,.015) 2px 6px),
      linear-gradient(180deg,#efeff0,#d8d9db);
    overflow-x:hidden;
  }

  /* شريط أعلى وأسفل الصفحة (زي تصميم الباكدجات) */
  .bar{position:fixed;left:0;right:0;height:9px;z-index:5;background:linear-gradient(90deg,var(--red) 0 36%,var(--black) 36% 100%)}
  .bar.top{top:0}
  .bar.bottom{bottom:0;background:linear-gradient(90deg,var(--black) 0 64%,var(--red) 64% 100%)}

  /* أشكال هندسية في الخلفية (زي الأوكتاجون بتاع اللوجو) */
  .bg-shape{
    position:fixed;pointer-events:none;z-index:0;
    clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  }
  .bg-shape.a{width:520px;height:520px;top:-150px;left:-170px;background:linear-gradient(135deg,rgba(181,18,27,.16),transparent 70%)}
  .bg-shape.b{width:440px;height:440px;bottom:-150px;right:-130px;background:linear-gradient(135deg,rgba(26,26,28,.10),transparent 70%)}

  .wrap{position:relative;z-index:1;max-width:1050px;margin:0 auto;padding:36px 18px 70px}

  /* ============ الهيدر واللوجو ============ */
  header{text-align:center;margin-bottom:22px}
  .logo-img{
    width:230px;max-width:62vw;height:auto;display:none;margin:0 auto;border-radius:16px;
    box-shadow:0 18px 40px rgba(0,0,0,.28),0 2px 0 rgba(255,255,255,.7) inset;
    border:1px solid rgba(0,0,0,.12);
  }
  /* اسم مكتوب بيظهر لحد ما تحط صورة اللوجو */
  .brand{font-weight:900;font-size:56px;letter-spacing:4px;line-height:1;direction:ltr}
  .brand .z1{color:var(--black)}
  .brand .z2{color:var(--red)}
  .brand-sub{font-weight:900;letter-spacing:12px;font-size:22px;color:var(--black);margin-top:4px;padding-left:12px}

  /* ============ شريط الخطوات ============ */
  .steps{display:flex;justify-content:center;align-items:center;gap:10px;margin:26px 0 30px}
  .dot{
    width:40px;height:40px;display:grid;place-items:center;font-weight:900;
    background:var(--silver-2);color:var(--muted);
    clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
    transition:.3s;
  }
  .dot.active{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff}
  .dot.done{background:var(--black);color:#fff}
  .line{width:60px;height:3px;background:var(--silver-2);border-radius:3px;position:relative;overflow:hidden}
  .line::after{content:"";position:absolute;inset:0;background:var(--red);transform:scaleX(0);transform-origin:right;transition:.4s}
  .line.on::after{transform:scaleX(1)}

  /* ============ الصفحات ============ */
  .page{display:none;animation:fade .5s ease}
  .page.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  h2.title{text-align:center;font-size:30px;font-weight:900;margin-bottom:6px}
  h2.title span{color:var(--red);border-bottom:4px solid var(--red)}
  p.hint{text-align:center;color:var(--muted);margin-bottom:28px;margin-top:10px}

  /* ============ كروت الباكدجات ============ */
  .packs{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .pack{
    position:relative;cursor:pointer;text-align:center;padding:0;
    border-radius:16px;overflow:hidden;
    background:linear-gradient(160deg,#ffffff,#e7e7e9);
    border:2px solid var(--black);
    border-right:8px solid var(--red);
    box-shadow:0 10px 26px rgba(0,0,0,.14);
    transition:.35s;isolation:isolate;
  }
  .pack:hover{transform:translateY(-6px);box-shadow:0 18px 38px rgba(0,0,0,.22)}
  .pack.selected{outline:4px solid var(--red);outline-offset:3px;transform:translateY(-6px);box-shadow:0 20px 44px var(--red-glow)}
  .pack input{position:absolute;opacity:0;pointer-events:none;top:0;left:0;width:1px;height:1px}

  .pack-art{
    height:190px;position:relative;display:grid;place-items:center;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.12) 0 2px, rgba(0,0,0,.04) 2px 7px),
      linear-gradient(135deg,#9a9ca1,#eceded 45%,#8a8c91);
    overflow:hidden;border-bottom:2px solid var(--black);
  }
  /* وجوه هندسية حمرا زي اللوجو */
  .pack-art::before,.pack-art::after{content:"";position:absolute;background:linear-gradient(135deg,var(--red),var(--red-dark))}
  .pack-art::before{width:170px;height:170px;top:-60px;right:-50px;clip-path:polygon(0 0,100% 0,100% 100%)}
  .pack-art::after{width:140px;height:140px;bottom:-50px;left:-40px;clip-path:polygon(0 100%,100% 100%,0 0);opacity:.92}
  .pack-art .big{
    position:relative;z-index:2;font-size:98px;font-weight:900;line-height:1;color:var(--black);
    text-shadow:0 3px 0 rgba(255,255,255,.6);
  }
  .pack-art .badge{
    position:absolute;z-index:2;top:12px;left:12px;background:var(--black);color:#fff;
    font-size:12px;font-weight:700;padding:4px 10px;border-radius:30px;letter-spacing:1px
  }
  .pack-body{padding:18px 16px 22px}
  .pack-body h3{font-size:24px;font-weight:900}
  .pack-body p{color:var(--muted);font-size:14px;margin-top:4px}
  .feat{list-style:none;margin:16px 0 0;text-align:right;border-top:1px solid var(--line);padding-top:12px}
  .feat li{position:relative;padding:6px 40px 6px 0;font-size:14.5px;font-weight:700;color:var(--text);min-height:34px;display:flex;flex-direction:column;justify-content:center}
  .feat li::before{
    content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:28px;height:28px;background:var(--black);
    clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)
  }
  .feat{counter-reset:f}
  .feat li{counter-increment:f}
  .feat li::after{
    content:counter(f);position:absolute;right:0;top:50%;transform:translateY(-50%);width:28px;height:28px;
    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:900
  }
  .feat li small{display:block;color:var(--red);font-size:12px;font-weight:700;direction:ltr;text-align:right}
  .feat li.offer{margin-top:8px;padding:10px;text-align:center;align-items:center;font-weight:900;letter-spacing:2px;color:#fff;
    border-radius:8px;background:linear-gradient(135deg,var(--red),var(--red-dark));border-left:6px solid var(--black)}
  .feat li.offer::before,.feat li.offer::after{display:none}
  .check{
    margin:14px auto 0;width:36px;height:36px;display:grid;place-items:center;
    background:var(--silver-2);color:transparent;font-weight:900;transition:.3s;
    clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  }
  .pack.selected .check{background:var(--red);color:#fff}

  /* ============ زراير ============ */
  .actions{display:flex;justify-content:center;gap:14px;margin-top:32px;flex-wrap:wrap}
  .btn{
    font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;border:none;
    padding:14px 44px;color:#fff;border-radius:10px;transition:.3s;
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    box-shadow:0 10px 24px var(--red-glow);
  }
  .btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px var(--red-glow)}
  .btn.ghost{background:transparent;border:2px solid var(--black);color:var(--black);box-shadow:none}
  .btn.ghost:hover{background:var(--black);color:#fff;box-shadow:none}
  .msg-err{color:var(--red);text-align:center;margin-top:14px;min-height:22px;font-weight:700}

  /* ============ رابط التجربة ============ */
  .test-box{
    margin:44px auto 0;max-width:620px;text-align:center;padding:20px;
    border:2px dashed #9b9ca1;border-radius:14px;background:rgba(255,255,255,.55)
  }
  .test-box small{display:block;color:var(--muted);margin-bottom:8px;font-weight:700}
  .test-box a{color:var(--red);font-weight:900;font-size:18px;text-decoration:none;word-break:break-all;direction:ltr;display:inline-block}
  .test-box a:hover{text-decoration:underline}

  /* ============ الفورم ============ */
  .card{
    max-width:640px;margin:0 auto;padding:30px 26px;border-radius:16px;
    background:linear-gradient(160deg,#ffffff,#ececee);
    border:2px solid var(--black);border-right:8px solid var(--red);
    box-shadow:0 20px 50px rgba(0,0,0,.2);position:relative;overflow:hidden
  }
  .chosen{
    display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;
    background:var(--black);color:#fff;padding:9px 18px;border-radius:30px;font-weight:700
  }
  .chosen b{color:#ff8b92}
  .field{margin-bottom:20px}
  .field>label,.field>.lbl{display:block;font-weight:900;margin-bottom:8px;color:var(--black)}
  input[type=text],input[type=number],textarea{
    width:100%;font-family:inherit;font-size:16px;color:var(--text);
    background:#fff;border:2px solid var(--line);border-radius:10px;padding:13px 14px;transition:.25s;outline:none
  }
  textarea{min-height:92px;resize:vertical}
  input:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(181,18,27,.15)}

  .choices{display:flex;gap:12px;flex-wrap:wrap}
  .choice{flex:1;min-width:130px;position:relative}
  .choice input{position:absolute;opacity:0}
  .choice span{
    display:block;text-align:center;padding:13px;border-radius:10px;cursor:pointer;font-weight:700;
    background:#fff;border:2px solid var(--line);transition:.25s
  }
  .choice span:hover{border-color:var(--black)}
  .choice input:checked+span{background:linear-gradient(135deg,var(--red),var(--red-dark));border-color:var(--red);color:#fff;box-shadow:0 8px 20px var(--red-glow)}
  #healthBox{display:none;margin-top:12px;animation:fade .4s}

  footer{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:50px;color:var(--black);font-size:13px;font-weight:700;letter-spacing:5px;direction:ltr}
  footer i{display:block;width:60px;height:3px;background:var(--red)}

  @media(max-width:820px){
    .packs{grid-template-columns:1fr;max-width:380px;margin:0 auto}
    .pack-art{height:150px}
    .pack-art .big{font-size:76px}
    .brand{font-size:44px}
  }
</style>
</head>
<body>
<div class="bar top"></div>
<div class="bar bottom"></div>
<div class="bg-shape a"></div>
<div class="bg-shape b"></div>

<div class="wrap">

  <!-- ============ الهيدر (صورة اللوجو) ============ -->
  <!-- الصورة بتتحط من LOGO_SRC في الـ script تحت، ولحد ما تحطها بيظهر الاسم مكتوب -->
  <header>
    <img class="logo-img" id="logoImg" alt="ZOZKA FIT">
    <div id="logoText">
      <div class="brand"><span class="z1">ZO</span><span class="z2">ZKA</span></div>
      <div class="brand-sub">FIT</div>
    </div>
  </header>

  <!-- ============ شريط الخطوات ============ -->
  <div class="steps">
    <div class="dot active" id="d1">1</div>
    <div class="line" id="l1"></div>
    <div class="dot" id="d2">2</div>
  </div>

  <!-- ============ الصفحة 1: الباكدجات ============ -->
  <section class="page show" id="page1">
    <h2 class="title">اختار <span>الباكدج</span> بتاعك</h2>
    <p class="hint">دوس على الباكدج اللي يناسبك وبعدين اضغط التالي</p>

    <div class="packs">

      <label class="pack" data-pack="باكدج شهر">
        <input type="radio" name="pack" value="باكدج شهر">
        <div class="pack-art"><span class="badge">PACKAGE</span><div class="big">1</div></div>
        <div class="pack-body">
          <h3>باكدج الشهر</h3>
          <p>ابدأ رحلتك وجرّب النظام</p>
          <ul class="feat">
            <li>نظام تدريبي مناسب لهدفك <small>(In Zozka Fit Site)</small></li>
            <li>نظام غذائي مناسب لاحتياجاتك</li>
            <li>متابعة أسبوعية</li>
          </ul>
          <div class="check">✓</div>
        </div>
      </label>

      <label class="pack" data-pack="باكدج شهرين">
        <input type="radio" name="pack" value="باكدج شهرين">
        <div class="pack-art"><span class="badge">PACKAGE</span><div class="big">2</div></div>
        <div class="pack-body">
          <h3>باكدج الشهرين</h3>
          <p>وقت كفاية لنتيجة ملحوظة</p>
          <ul class="feat">
            <li>نظام تدريبي مناسب لهدفك <small>(In Zozka Fit Site)</small></li>
            <li>نظام غذائي مناسب لاحتياجاتك</li>
            <li>متابعة دورية (24 ساعة)</li>
            <li class="offer">OFFER +</li>
          </ul>
          <div class="check">✓</div>
        </div>
      </label>

      <label class="pack" data-pack="باكدج 3 شهور">
        <input type="radio" name="pack" value="باكدج 3 شهور">
        <div class="pack-art"><span class="badge">PACKAGE</span><div class="big">3</div></div>
        <div class="pack-body">
          <h3>باكدج 3 شهور</h3>
          <p>تحوّل كامل والتزام أطول</p>
          <ul class="feat">
            <li>نظام تدريبي مناسب لهدفك <small>(In Zozka Fit Site)</small></li>
            <li>نظام غذائي مناسب لاحتياجاتك</li>
            <li>متابعة دورية (24 ساعة)</li>
            <li>ضمان وصول لأفضل نتيجة <small>(خلال المدة)</small></li>
            <li class="offer">OFFER ++</li>
          </ul>
          <div class="check">✓</div>
        </div>
      </label>

    </div>

    <div class="msg-err" id="err1"></div>
    <div class="actions">
      <button class="btn" id="next">التالي ←</button>
    </div>

    <!-- ============ لينك التجربة ============ -->
    <!-- لما يجهز اللينك: غيّر قيمة TEST_LINK في الـ script تحت -->
    <div class="test-box" id="testBox">
      <small>رابط التجربة</small>
      <a id="testLink" href="#" target="_blank" rel="noopener">........................</a>
    </div>
  </section>

  <!-- ============ الصفحة 2: الفورم ============ -->
  <section class="page" id="page2">
    <h2 class="title">بياناتك <span>الشخصية</span></h2>
    <p class="hint">املا البيانات وهنبعتها مباشرة على الواتساب</p>

    <form class="card" id="form" novalidate>
      <div class="chosen">الباكدج المختار: <b id="chosenName">—</b></div>

      <div class="field">
        <label for="name">الاسم</label>
        <input type="text" id="name" placeholder="اكتب اسمك بالكامل" autocomplete="name">
      </div>

      <div class="field">
        <label for="age">السن</label>
        <input type="number" id="age" min="10" max="90" placeholder="مثال: 25" inputmode="numeric">
      </div>

      <div class="field">
        <span class="lbl">الجنس</span>
        <div class="choices">
          <label class="choice"><input type="radio" name="gender" value="ذكر"><span>ذكر</span></label>
          <label class="choice"><input type="radio" name="gender" value="أنثى"><span>أنثى</span></label>
        </div>
      </div>

      <div class="field">
        <label for="goal">الهدف</label>
        <textarea id="goal" placeholder="اكتب هدفك (تنشيف، تضخيم، خسارة وزن، لياقة...)"></textarea>
      </div>

      <div class="field">
        <span class="lbl">الحالة الصحية</span>
        <div class="choices">
          <label class="choice"><input type="radio" name="health" value="لا يوجد"><span>لا يوجد</span></label>
          <label class="choice"><input type="radio" name="health" value="يوجد"><span>يوجد</span></label>
        </div>
        <div id="healthBox">
          <textarea id="healthText" placeholder="اكتب حالتك الصحية (أمراض، إصابات، حساسية...)"></textarea>
        </div>
      </div>

      <div class="msg-err" id="err2"></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="back">→ رجوع</button>
        <button type="submit" class="btn">إرسال على واتساب</button>
      </div>
    </form>
  </section>

  <footer><i></i>ZOZKA FIT<i></i></footer>
</div>

<script>
  /* ============ إعدادات ============ */
  const WHATSAPP_NUMBER = "201119052812";                 // +20 11 19052812
  const TEST_LINK = "........................";            // ← حط لينك التجربة هنا لما يجهز
  const LOGO_SRC  = ".............................";       // ← حط لينك صورة اللوجو أو اسم الملف (مثال: "logo.jpg") لما تجهز

  /* ============ عناصر ============ */
  const $ = (id) => document.getElementById(id);
  const page1 = $("page1"), page2 = $("page2");
  let selectedPack = "";

  /* صورة اللوجو: لو لسه نقط بيظهر الاسم مكتوب، ولو حطيت صورة بتظهر هي */
  (function setLogo(){
    const img = $("logoImg"), txt = $("logoText");
    if (/^\.*$/.test(LOGO_SRC.trim())) return;      // لسه نقط
    img.onload  = () => { img.style.display = "block"; txt.style.display = "none"; };
    img.onerror = () => { img.style.display = "none";  txt.style.display = "block"; };
    img.src = LOGO_SRC;
  })();

  /* لينك التجربة: يظهر كنقط لحد ما تحط لينك حقيقي */
  (function setTestLink(){
    const a = $("testLink");
    if (/^https?:\/\//i.test(TEST_LINK)) {
      a.href = TEST_LINK; a.textContent = TEST_LINK;
    } else {
      a.textContent = TEST_LINK; a.removeAttribute("href");
    }
  })();

  /* ============ اختيار الباكدج ============ */
  document.querySelectorAll(".pack").forEach(card => {
    card.addEventListener("click", (e) => {
      e.preventDefault();   // يمنع الصفحة إنها تطلع لفوق
      document.querySelectorAll(".pack").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      card.querySelector("input").checked = true;
      selectedPack = card.dataset.pack;
      $("err1").textContent = "";
    });
  });

  function goStep(n){
    page1.classList.toggle("show", n === 1);
    page2.classList.toggle("show", n === 2);
    $("d1").className = "dot " + (n === 1 ? "active" : "done");
    $("d2").className = "dot " + (n === 2 ? "active" : "");
    $("l1").classList.toggle("on", n === 2);
  }

  $("next").addEventListener("click", () => {
    if (!selectedPack) {
      $("err1").textContent = "من فضلك اختار باكدج الأول";
      $("err1").scrollIntoView({behavior:"smooth", block:"center"});
      return;
    }
    $("chosenName").textContent = selectedPack;
    goStep(2);
  });
  $("back").addEventListener("click", () => goStep(1));

  /* ============ الحالة الصحية ============ */
  document.querySelectorAll('input[name="health"]').forEach(r => {
    r.addEventListener("change", () => {
      const yes = document.querySelector('input[name="health"]:checked').value === "يوجد";
      $("healthBox").style.display = yes ? "block" : "none";
      if (!yes) $("healthText").value = "";
    });
  });

  /* ============ إرسال على واتساب ============ */
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const err = $("err2"); err.textContent = "";

    const name = $("name").value.trim();
    const age = $("age").value.trim();
    const gender = (document.querySelector('input[name="gender"]:checked') || {}).value;
    const goal = $("goal").value.trim();
    const health = (document.querySelector('input[name="health"]:checked') || {}).value;
    const healthText = $("healthText").value.trim();

    const fail = (msg) => { err.textContent = msg; err.scrollIntoView({behavior:"smooth", block:"center"}); };

    if (!name)   return fail("من فضلك اكتب الاسم");
    if (!age || age < 10 || age > 90) return fail("من فضلك اكتب سن صحيح");
    if (!gender) return fail("من فضلك اختار الجنس");
    if (!goal)   return fail("من فضلك اكتب هدفك");
    if (!health) return fail("من فضلك اختار الحالة الصحية");
    if (health === "يوجد" && !healthText) return fail("من فضلك اكتب حالتك الصحية");

    const line = "------------------------------";
    const lines = [
